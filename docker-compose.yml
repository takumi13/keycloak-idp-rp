###############################################################################
# Keycloak + MySQL stack for the Spring Boot OIDC client.
# - Variables are supplied via .env (see README "KeycloakとMySQLの起動").
# - Certificate/truststore assets live under certs/ and ssl/.
# - Additional context: local/0.7.ドキュメントとdocker-composeの更新.md
###############################################################################
volumes:
  mysql_data:

services:
  mysql:
    image: mysql:8.0.43
    container_name: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      # ------------------------------------------------------------------
      # [mysql] Bootstrap credentials (align with .env example in README)
      # ------------------------------------------------------------------
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.1
    container_name: keycloak
    environment:
      # ------------------------------------------------------------------
      # [keycloak admin] UI ログインに使う初期資格情報
      # ------------------------------------------------------------------
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # ------------------------------------------------------------------
      # [database] MySQL 接続設定（mysql サービスと同一ネットワーク）
      # ------------------------------------------------------------------
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      # ------------------------------------------------------------------
      # [logging] ローカル検証向けに DEBUG ログとアクセスログを出力
      # ------------------------------------------------------------------
      KC_LOG: "console,file"
      KC_LOG-FILE: "data/server.log"
      KC_LOG-LEVEL: "DEBUG"
      QUARKUS_HTTP_ACCESS_LOG_LOG_DIRECTORY: "logs"
      QUARKUS_HTTP_ACCESS_LOG_BASE_FILE_NAME: "access"
      QUARKUS_HTTP_RECORD_REQUEST_START_TIME: true
      QUARKUS_HTTP_ACCESS_LOG_PATTERN: "%h %l %u %t \"%r\" %s %b \"%{i,Referer}\" \"%{i,User-Agent}\" %D"

      # ------------------------------------------------------------------
      # [https/mtls] 開発用サーバ証明書と truststore の設定
      # ------------------------------------------------------------------
      # サーバ証明書（PEM）
      KC_HTTPS_CERTIFICATE_FILE: "/opt/keycloak/conf/tls.crt"
      KC_HTTPS_CERTIFICATE_KEY_FILE: "/opt/keycloak/conf/tls.key"

      # クライアント側のtruststore
      KC_HTTPS_TRUST_STORE_FILE: "/opt/keycloak/conf/truststore.p12"
      KC_HTTPS_TRUST_STORE_PASSWORD: "changeit"
      KC_HTTPS_TRUST_STORE_TYPE: "PKCS12"

      # クライアント証明書要求モード（"required" で強制 mTLS）
      KC_HTTPS_CLIENT_AUTH: "request"
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      # Keycloak HTTPS サーバ証明書（外部 docs/1.1.* を参照）
      - ./certs/keycloak-https-server.crt:/opt/keycloak/conf/tls.crt:ro
      - ./certs/keycloak-https-server.key:/opt/keycloak/conf/tls.key:ro

      # oidc-client→Keycloak の通信で利用する truststore
      - ./ssl/truststore.p12:/opt/keycloak/conf/truststore.p12:ro
    depends_on:
      mysql:
        condition: service_healthy
    command: ["start-dev"]
    restart: unless-stopped
