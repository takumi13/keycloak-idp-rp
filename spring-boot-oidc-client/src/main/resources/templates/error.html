<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>OIDC Client Error</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 0 auto; padding: 24px; line-height: 1.5; }
    h1 { color: #c62828; }
    .card { border: 1px solid #f5c2c7; background: #fff5f5; padding: 16px; border-radius: 6px; }
    .actions { margin-top: 20px; }
    a.btn { display: inline-block; background: #1976d2; color: #fff; padding: 8px 16px; border-radius: 4px; text-decoration: none; }
    a.btn.secondary { background: #555; }
    pre { background: #f8f8f8; padding: 12px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>操作を続行できません</h1>
    <p th:text="${error_message != null ? error_message : 'An unexpected error occurred.'}">
      An unexpected error occurred.
    </p>
    <pre th:if="${error_detail != null}" th:text="${error_detail}">No detail</pre>
  </div>
  <div class="actions">
    <a class="btn" href="/authorization-flow">認可フローに戻る</a>
    <a class="btn secondary" href="/">ホームへ戻る</a>
  </div>
</body>
</html>
